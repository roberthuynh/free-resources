name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-retries 2 --accept '200..=299,403,429' README.md CONTRIBUTING.md
          fail: true
